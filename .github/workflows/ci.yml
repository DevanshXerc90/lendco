name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff
      - run: python -m data.generate
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: ruff check api/index.py eval/evaluator.py eval/lcel_parity.py eval/adversarial.py tests/test_api_security.py tests/test_readme_results.py
